name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Test (Go ${{ matrix.go }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        go:
          - "1.25"
          - "1.26"
          - stable

    steps:
      - uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ matrix.go }}
          cache: true

      - name: Verify dependencies
        run: |
          go mod verify
          go mod download

      - name: Check go mod tidy
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum

      - name: Build
        run: go build ./...

      - name: Run tests
        run: go test -race -shuffle=on -short -count=1 ./tests/...

  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.25"
          cache: true

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.15.0

  e2e-ws:
    name: E2E live match (WS)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.25"
          cache: true

      - name: Run e2e scenario
        run: go test -race -v -run '^TestE2E_LiveMatch_HostMigration$' -count=1 -timeout 300s ./tests/integration/

  e2e-enet:
    name: E2E live match (ENet)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.25"
          cache: true

      - name: Install ENet dependencies
        run: sudo apt-get update && sudo apt-get install -y gcc pkg-config libenet-dev

      - name: Run e2e scenario
        env:
          CGO_ENABLED: "1"
        run: go test -race -v -tags enet -run '^TestE2E_LiveMatch_ENet$' -count=1 -timeout 300s ./tests/integration/

  e2e-mixed:
    name: E2E live match (mixed WS+ENet)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.25"
          cache: true

      - name: Install ENet dependencies
        run: sudo apt-get update && sudo apt-get install -y gcc pkg-config libenet-dev

      - name: Run e2e scenario
        env:
          CGO_ENABLED: "1"
        run: go test -race -v -tags enet -run '^TestE2E_LiveMatch_Mixed$' -count=1 -timeout 300s ./tests/integration/

  enet:
    name: ENet smoke (cgo)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.25"
          cache: true

      - name: Install ENet dependencies
        run: sudo apt-get update && sudo apt-get install -y gcc pkg-config libenet-dev

      - name: Run ENet tests
        env:
          CGO_ENABLED: "1"
        run: go test -race -count=1 -tags enet ./tests/delivery/enet/... ./tests/adapter/transport/enet/...

  fuzz:
    name: Fuzz (codec)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.25"
          cache: true

      - name: Restore fuzz corpus cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/go-build/fuzz
          key: fuzz-corpus-${{ runner.os }}
          restore-keys: |
            fuzz-corpus-${{ runner.os }}-

      - name: Fuzz codec decoders (30s each)
        run: |
          failed=0
          for target in FuzzRoomStateDecode FuzzRoomStateDecodePatch FuzzEntitiesStateDecode FuzzEntitiesStateDecodePatch FuzzInputStateDecode FuzzInputStateDecodePatch FuzzRpcStateDecode; do
            go test -run='^$' -fuzz="^${target}$" -fuzztime=30s ./tests/adapter/realtime/codec/ || failed=1
          done
          exit "$failed"

      - name: Upload crash reproducers
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-crashers
          path: tests/adapter/realtime/codec/testdata/fuzz/**
          if-no-files-found: ignore
